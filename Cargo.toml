[package]
name = "ferry"
version = "0.2.1"
description = "A keyboard-first file manager that follows the Omarchy theme"
license = "MIT"
authors = ["Yojahny Chavez"]
repository = "https://github.com/yojahny55/ferry"
homepage = "https://github.com/yojahny55/ferry"
readme = "README.md"
keywords = ["file-manager", "omarchy", "hyprland", "wayland", "egui"]
categories = ["filesystem", "gui"]
rust-version = "1.95"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.35"
libc = "0.2.191"
md-5 = "0.11.0"
nucleo-matcher = "0.3.1"
png = "0.18.1"
pulldown-cmark = "0.13.6"
raw-window-handle = "0.6"
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = "thin"
# Keep function names so crash reports (coredumpctl) show where a crash happened.
strip = "debuginfo"

[dev-dependencies]
egui_kittest = "0.37"
