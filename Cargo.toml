[package]
name = "ferry"
version = "0.1.0"
description = "A keyboard-first file manager that follows the Omarchy theme"
license = "MIT"
authors = ["Yojahny Chavez"]
repository = "https://github.com/yojahny55/ferry"
homepage = "https://github.com/yojahny55/ferry"
readme = "README.md"
keywords = ["file-manager", "omarchy", "hyprland", "wayland", "egui"]
categories = ["filesystem", "gui"]
rust-version = "1.95"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
libc = "0.2.191"
md-5 = "0.11.0"
png = "0.18.1"
raw-window-handle = "0.6"
serde_json = "1.0.154"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"

[profile.release]
lto = "thin"
strip = true
