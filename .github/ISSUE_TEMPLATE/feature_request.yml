name: Feature request
description: Suggest something Ferry should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or annoyance behind the request.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work, including any keyboard shortcut.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: How other file managers do it
      description: Optional, e.g. how Dolphin or Nautilus handle this.
