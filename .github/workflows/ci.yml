name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    # Built on Arch, the base of Omarchy, so CI matches what users run.
    container: archlinux:latest
    steps:
      - name: Install toolchain and libraries
        run: pacman -Syu --noconfirm --needed rust base-devel git wayland libxkbcommon libglvnd fontconfig
      - uses: actions/checkout@v4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
